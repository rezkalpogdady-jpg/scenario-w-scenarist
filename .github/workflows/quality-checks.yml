name: Platform quality checks

on:
  push:
    branches:
      - "stage/**"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  inline-javascript:
    name: Check inline JavaScript syntax
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Parse every inline JavaScript block
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const os = require('node:os');
          const path = require('node:path');
          const { spawnSync } = require('node:child_process');

          const html = fs.readFileSync('index.html', 'utf8');
          const scriptTag = /<script\b([^>]*)>([\s\S]*?)<\/script\s*>/gi;
          let match;
          let checked = 0;
          let failed = false;

          while ((match = scriptTag.exec(html)) !== null) {
            const attrs = match[1] || '';
            const code = match[2] || '';
            if (/\bsrc\s*=/i.test(attrs) || !code.trim()) continue;
            if (/type\s*=\s*["']application\/(?:ld\+)?json["']/i.test(attrs)) continue;

            checked += 1;
            const file = path.join(os.tmpdir(), `inline-script-${checked}.js`);
            fs.writeFileSync(file, code, 'utf8');
            const result = spawnSync(process.execPath, ['--check', file], { encoding: 'utf8' });

            if (result.status !== 0) {
              failed = true;
              console.error(`Syntax error in inline script #${checked}:`);
              console.error(result.stderr || result.stdout);
            }
          }

          console.log(`Checked ${checked} inline JavaScript block(s).`);
          if (checked === 0) {
            console.error('No inline JavaScript blocks were found; refusing a false-green result.');
            process.exit(1);
          }
          if (failed) process.exit(1);
          NODE

      - name: Check dynamic inline handler arguments
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const vm = require('node:vm');
          const html = fs.readFileSync('index.html', 'utf8');
          const helper = html.match(/function inlineJsArg\(value\)\s*\{[\s\S]*?\n\}/);
          if (!helper) throw new Error('inlineJsArg safety helper is missing.');
          const inlineJsArg = vm.runInNewContext(helper[0] + '; inlineJsArg');
          const payload = '"><img src=x onerror=alert(1)>&' + String.fromCharCode(0x2028);
          const encoded = inlineJsArg(payload);
          const body = encoded.slice(6, -6);
          if (!encoded.startsWith('&quot;') || !encoded.endsWith('&quot;') ||
              /[<>&\u2028\u2029]/.test(body)) {
            throw new Error('inlineJsArg failed the hostile-input serialization test.');
          }
          const lines = html.split(/\r?\n/);
          const unsafe = [];
          lines.forEach((line, index) => {
            const attr = line.match(/onclick="([^"]*)"/);
            if (!attr || !attr[1].includes('\${')) return;
            for (const match of attr[1].matchAll(/\$\{([^}]*)\}/g)) {
              const expr = match[1].trim();
              if (!expr.startsWith('inlineJsArg(') && expr !== 'index' && expr !== '!item.published') {
                unsafe.push('line ' + (index + 1) + ': ' + expr);
              }
            }
          });
          if (unsafe.length) {
            console.error('Dynamic inline handler arguments must use inlineJsArg():');
            console.error(unsafe.join('\n'));
            process.exit(1);
          }
          console.log('Dynamic inline handler arguments passed serialization checks.');
          NODE

      - name: Test URL scheme validation and media URL sinks
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const vm = require('node:vm');
          const html = fs.readFileSync('index.html', 'utf8');
          const helper = html.match(/function safeHttpUrl\(value\)\s*\{[\s\S]*?\n\}/);
          if (!helper) throw new Error('safeHttpUrl validation helper is missing.');
          const safeHttpUrl = vm.runInNewContext(helper[0] + '; safeHttpUrl', {
            URL,
            window: { location: { href: 'https://platform.example/page' } }
          });
          for (const value of ['javascript:alert(1)', 'data:text/html,<script>alert(1)</script>', 'vbscript:msgbox(1)']) {
            if (safeHttpUrl(value) !== '') throw new Error('Unsafe URL scheme was accepted: ' + value);
          }
          for (const value of ['https://cdn.example/media.mp4', 'http://radio.example/live', '/storage/image.png']) {
            if (!safeHttpUrl(value).startsWith('http')) throw new Error('Expected HTTP(S) URL was rejected: ' + value);
          }
          for (const fn of ['playTVChannel', 'playRadioStation']) {
            const start = html.indexOf('function ' + fn + '(');
            if (start < 0 || !html.slice(start, start + 1800).includes('safeHttpsMediaUrl(')) {
              throw new Error(fn + ' must validate its stream URL before playback.');
            }
          }
          if (/href="\$\{adminEscape\((?:(?:item\.)?(?:work_url|image_url)|reviewUrl)\)\}"/.test(html)) {
            throw new Error('An escaped but scheme-unvalidated database URL remains in an href.');
          }
          if (/src="\$\{escapeHTML\(item\.cover\)\}"/.test(html)) {
            throw new Error('A database cover URL remains in an image src without scheme validation.');
          }
          const cleanup = html.match(/async function adminRemoveStorageIfUnreferenced\(client,bucket,table,column,path\)\s*\{[\s\S]*?\n\}/);
          if (!cleanup) throw new Error('Shared-storage reference guard is missing.');
          const guard = cleanup[0];
          if (!guard.includes('.from(table).select("id").eq(column,path).limit(1)') ||
              !guard.includes('if(error||!Array.isArray(data))') || !guard.includes('if(data.length)') ||
              !guard.includes('.storage.from(bucket).remove([path])') ||
              !guard.includes('reason:"reference-check-failed"')) {
            throw new Error('Shared-storage guard must verify references and retain files on lookup failure.');
          }
          const deleteStart = html.indexOf('async function adminDeleteScenarioScript(');
          const deleteEnd = html.indexOf('document.getElementById("adminScenarioScriptForm")', deleteStart);
          const deleteBody = html.slice(deleteStart, deleteEnd);
          if (deleteStart < 0 || !deleteBody.includes('adminRemoveStorageIfUnreferenced(')) {
            throw new Error('Scenario deletion must use the shared-storage reference guard.');
          }
          const reviewStart = html.indexOf('async function adminReviewMemberWork(');
          const reviewEnd = html.indexOf('async function adminLoadVisitStats(', reviewStart);
          const reviewBody = html.slice(reviewStart, reviewEnd);
          if (reviewStart < 0 || !reviewBody.includes('adminRemoveStorageIfUnreferenced(')) {
            throw new Error('Member-work review must use the shared-storage reference guard.');
          }
          const saveStart = html.indexOf('document.getElementById("adminScenarioScriptForm")?.addEventListener');
          const saveEnd = html.indexOf('async function loadPublishedScenarioScripts(', saveStart);
          const saveBody = html.slice(saveStart, saveEnd);
          if (saveStart < 0 || !saveBody.includes('adminRemoveStorageIfUnreferenced(')) {
            throw new Error('Replacing a scenario PDF must use the shared-storage reference guard.');
          }
          const siteGuard = html.match(/async function adminRemoveSiteMediaIfUnreferenced\(path\)\s*\{[\s\S]*?\n\}/);
          if (!siteGuard || !siteGuard[0].includes('from("site_content").select("image_url,content_url")') ||
              !siteGuard[0].includes('if(error||!Array.isArray(data))') ||
              !siteGuard[0].includes('storage.from("site-media").remove([path])')) {
            throw new Error('New site-media uploads must be checked against content references before cleanup.');
          }
          const memberFormStart = html.indexOf('document.getElementById("memberWorkForm")?.addEventListener');
          const memberFormEnd = html.indexOf('document.getElementById("accountLogout")', memberFormStart);
          const memberForm = html.slice(memberFormStart, memberFormEnd);
          if (memberFormStart < 0 || !memberForm.includes('adminRemoveStorageIfUnreferenced(accountClient(),')) {
            throw new Error('Member upload failure cleanup must check for a saved member_works reference.');
          }
          const contentSaveStart = html.indexOf('let uploadedAsset=null;');
          const contentSaveEnd = html.indexOf('/* نظّف الملفات القديمة', contentSaveStart);
          const contentSave = html.slice(contentSaveStart, contentSaveEnd);
          if (contentSaveStart < 0 || !contentSave.includes('adminRemoveSiteMediaIfUnreferenced(')) {
            throw new Error('Site-content upload failure cleanup must check content references.');
          }
          const reviewStart2 = html.indexOf('async function adminReviewMemberWork(');
          const reviewEnd2 = html.indexOf('async function adminLoadVisitStats(', reviewStart2);
          const reviewBody2 = html.slice(reviewStart2, reviewEnd2);
          if (reviewBody2.includes('storage.from("site-media").remove([publicPath])')) {
            throw new Error('Do not delete a public copy after an ambiguous review RPC response.');
          }
          console.log('URL scheme tests and critical media URL sinks passed.');
          NODE

      - name: Check HTML escaping and private reader URL validation
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const vm = require('node:vm');
          const html = fs.readFileSync('index.html', 'utf8');
          const esc = html.match(/function escapeHTML\(value\)\s*\{[\s\S]*?\n\}/);
          const admin = html.match(/function adminEscape\(value\)\s*\{[\s\S]*?\n\}/);
          if (!esc || !admin) throw new Error('HTML escaping helpers are required.');
          const escapeHTML = vm.runInNewContext(esc[0] + '; escapeHTML');
          const adminEscape = vm.runInNewContext(admin[0] + '; adminEscape');
          const hostile = '<img src=x onerror=alert(1)> & "';
          for (const [name, fn] of [['escapeHTML', escapeHTML], ['adminEscape', adminEscape]]) {
            const out = fn(hostile);
            if (/[<>"']/.test(out) || !out.includes('&lt;') || !out.includes('&amp;')) throw new Error(name + ' failed hostile HTML escaping.');
          }
          const start = html.indexOf('async function openScenarioScript(');
          const end = html.indexOf('function closeScenarioReader(', start);
          const reader = html.slice(start, end);
          if (start < 0 || !reader.includes('safeHttpsMediaUrl(signed.signedUrl)') || !reader.includes('if(!readerUrl)') || !reader.includes('src="${escapeHTML(readerUrl)}#toolbar=0&navpanes=0&view=FitH"')) throw new Error('Private scenario iframe must validate its signed URL over HTTPS.');
          if (!html.includes('let scenarioReaderRequest=0;') || !reader.includes('const requestId=++scenarioReaderRequest;') || !reader.includes('if(requestId!==scenarioReaderRequest)return;') || !html.includes('function closeScenarioReader(){scenarioReaderRequest++;')) throw new Error('Scenario reader must ignore stale requests and invalidate pending work on close.');
          const uploadStart = html.indexOf('document.getElementById("adminScenarioScriptForm")?.addEventListener');
          const uploadEnd = html.indexOf('async function loadPublishedScenarioScripts(', uploadStart);
          const upload = html.slice(uploadStart, uploadEnd);
          for (const required of ['file.slice(0,5).arrayBuffer()', 'signature[0]!==0x25', 'signature[1]!==0x50', 'signature[2]!==0x44', 'signature[3]!==0x46', 'signature[4]!==0x2D', 'file.size>50*1024*1024', 'if(!title||!author)']) {
            if (!upload.includes(required)) throw new Error('Scenario PDF upload safeguard missing: ' + required);
          }
          console.log('HTML escaping, private HTTPS reader, and PDF signature validation checks passed.');
          NODE
      - name: Check member data access boundaries in client queries
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const html = fs.readFileSync('index.html', 'utf8');
          function section(startText, endText) {
            const start = html.indexOf(startText);
            const end = html.indexOf(endText, start + startText.length);
            if (start < 0 || end < 0) throw new Error('Could not isolate expected member access section.');
            return html.slice(start, end);
          }
          const profileLoad = section('async function accountLoadProfile(user)', 'document.getElementById("accountSignupForm")');
          if (!profileLoad.includes('.eq("user_id",user.id)')) throw new Error('Profile reads must be scoped to the signed-in user.');
          const worksLoad = section('async function accountLoadMemberWorks()', 'document.getElementById("memberWorkForm")');
          if (!worksLoad.includes('.eq("user_id",userId)') || !worksLoad.includes('if(accountUser?.id!==userId)return;')) throw new Error('Member work history must be scoped to the active signed-in user.');
          const profileSave = section('document.getElementById("accountProfileForm")', 'document.getElementById("accountNewPasswordForm")');
          if (!profileSave.includes('if(!accountUser) return') || !profileSave.includes('const userId=accountUser.id;') || !profileSave.includes('user_id:userId')) throw new Error('Profile writes must require and use the captured authenticated user ID.');
          if (!profileSave.includes('allowedAccountTypes=["writer","director","actor","presenter","voice","producer"]') || !profileSave.includes('!allowedAccountTypes.includes(account_type)') || !profileSave.includes('safeHttpsMediaUrl(image_url)') || !profileSave.includes('safeHttpsMediaUrl(work_url)')) throw new Error('Member profile updates must validate account type and HTTPS portfolio links.');
          if (!html.includes('let accountProfileRequest=0;') || !profileLoad.includes('const requestId=++accountProfileRequest;') || !profileLoad.includes('if(requestId!==accountProfileRequest)return;') || !html.includes('accountProfileRequest++;accountShowUser(null,null);') || !html.includes('accountProfileRequest++;\n      accountShowUser(null,null);')) throw new Error('Stale profile loads must not overwrite a later session or signed-out state.');
          const worksLoadGuard = section('async function accountLoadMemberWorks()', 'document.getElementById("memberWorkForm")');
          if (!worksLoadGuard.includes('const userId=accountUser?.id;') || !worksLoadGuard.includes('if(accountUser?.id!==userId)return;')) throw new Error('Portfolio history must not display results from a previous account.');
          if (!profileSave.includes('const requestId=accountProfileRequest;const userId=accountUser.id;') || !profileSave.includes('if(requestId!==accountProfileRequest||accountUser?.id!==userId)return;')) throw new Error('Profile save responses must be scoped to the active account.');
          const signup = section('document.getElementById("accountSignupForm")', 'document.getElementById("accountLoginForm")');
          if (!signup.includes('allowedAccountTypes=["writer","director","actor","presenter","voice","producer"]') || !signup.includes('!allowedAccountTypes.includes(account_type)')) throw new Error('Signup must reject unsupported member account types.');
          const workSubmit = section('document.getElementById("memberWorkForm")', 'document.getElementById("accountLogout")');
          if (!workSubmit.includes('if(!accountUser)') || !workSubmit.includes('user_id:accountUser.id')) throw new Error('Member work submissions must require and use the authenticated user ID.');
          const publicProfiles = section('async function loadApprovedMemberProfiles()', '/* إنشاء اتصال عام لقراءة المحتوى المنشور */');
          if (!publicProfiles.includes('.eq("profile_status","approved")')) throw new Error('Public profile directory must filter to approved profiles only.');
          if (publicProfiles.includes('.select("*"')) throw new Error('Public profile directory must not select all profile columns.');
          const profileCard = section('function profileCard(item, type)', '/* عرض الكُتّاب */');
          if (!profileCard.includes('safeHttpsMediaUrl(item.image)') || !profileCard.includes('safeHttpsMediaUrl(item.work)') || profileCard.includes('safeHttpUrl(item.image)') || profileCard.includes('safeHttpUrl(item.work)')) throw new Error('Public member profile cards must render only validated HTTPS image and portfolio links.');
          const adminProfiles = section('async function adminLoadMemberProfiles()', 'async function adminLoadMemberWorks()');
          if (!adminProfiles.includes('safeHttpsMediaUrl(item.image_url)') || !adminProfiles.includes('safeHttpsMediaUrl(item.work_url)') || !adminProfiles.includes('مرفوض سابقًا — في انتظار مراجعة جديدة')) throw new Error('Admin member profile review must validate external links and distinguish rejected resubmissions.');
          console.log('Member client-side access-boundary and secure profile-link checks passed. Database RLS still requires independent verification.');
          NODE
      - name: Check admin dashboard role gate
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const html = fs.readFileSync('index.html', 'utf8');
          const start = html.indexOf('async function adminVerifyAdmin(session)');
          const end = html.indexOf('/* تسجيل الدخول */', start);
          if (start < 0 || end < 0) throw new Error('Admin verification function could not be isolated.');
          const gate = html.slice(start, end);
          if (!gate.includes('data.user.app_metadata?.role') || !gate.includes('role!=="admin"')) throw new Error('Admin dashboard must require the trusted app_metadata admin role.');
          if (gate.includes('user_metadata')) throw new Error('Do not use user-editable metadata for admin authorization.');
          if (!gate.includes('adminDashboard").style.display="none"')) throw new Error('Non-admin users must not see the admin dashboard.');
          console.log('Admin dashboard client-side role gate checks passed; database authorization must still be verified independently.');
          NODE
      - name: Check admin upload extension and MIME allowlist
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const vm = require('node:vm');
          const html = fs.readFileSync('index.html', 'utf8');
          const match = html.match(/function validateAdminUploadFile\(file\)\s*\{[\s\S]*?\n\}/);
          if (!match) throw new Error('Upload validator is missing.');
          const validate = vm.runInNewContext(match[0] + '; validateAdminUploadFile');
          const cases = [
            [{name:'photo.jpg',type:'image/jpeg',size:1024}, true],
            [{name:'script.jpg',type:'text/html',size:1024}, false],
            [{name:'movie.mp4',type:'video/mp4',size:1024}, true],
            [{name:'fake.exe',type:'application/octet-stream',size:1024}, false],
            [{name:'large.pdf',type:'application/pdf',size:51*1024*1024}, false],
            [{name:'empty.pdf',type:'application/pdf',size:0}, false],
            [{name:'script.pdf',type:'text/html',size:1024}, false]
          ];
          for (const [file, expected] of cases) {
            let accepted = true; try { validate(file); } catch (_) { accepted = false; }
            if (accepted !== expected) throw new Error('Unexpected upload validation result for ' + file.name);
          }
          console.log('Admin upload extension/MIME allowlist checks passed.');
          NODE
      - name: Check TV and radio rights gates
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const html = fs.readFileSync('index.html', 'utf8');
          const required = [
            'function isAbsoluteHttpsUrl(value)',
            'function broadcastRightsApproved(item)',
            'rightsStatus:String(extra.rights_status||"").toLowerCase()',
            'sourceUrl:extra.source_url||""',
            'if(!["official","licensed"].includes(rightsStatus) || !sourceUrl || !streamUrl)',
            'if(!channel || !broadcastRightsApproved(channel))',
            'if(!station || !broadcastRightsApproved(station))',
            'const nowTitle=document.getElementById("tvNowTitle")',
            'const instance=new Hls();',
            'if(activeHlsPlayer===instance) activeHlsPlayer=null;',
            'if(activeRadioHlsPlayer===instance) activeRadioHlsPlayer=null;',
            'البث متوقف لحين توثيق المصدر وحقوق العرض'
          ];
          for (const snippet of required) {
            if (!html.includes(snippet)) throw new Error('Missing broadcast rights safeguard: ' + snippet);
          }
          console.log('TV/radio rights gate static checks passed.');
          NODE
      - name: Check member work upload extension and MIME allowlist
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const vm = require('node:vm');
          const html = fs.readFileSync('index.html', 'utf8');
          const match = html.match(/function validateMemberWorkUploadFile\(file\)\s*\{[\s\S]*?\n\}/);
          if (!match) throw new Error('Member work upload validator is missing.');
          const validate = vm.runInNewContext(match[0] + '; validateMemberWorkUploadFile');
          const cases = [
            [{name:'script.pdf',type:'text/html',size:1024}, false],
            [{name:'portfolio.pdf',type:'application/pdf',size:1024}, true],
            [{name:'portfolio.docx',type:'',size:1024}, true],
            [{name:'portfolio.exe',type:'application/pdf',size:1024}, false],
            [{name:'empty.txt',type:'text/plain',size:0}, false],
            [{name:'large.doc',type:'application/msword',size:26*1024*1024}, false]
          ];
          for (const [file, expected] of cases) {
            let accepted = true; try { validate(file); } catch (_) { accepted = false; }
            if (accepted !== expected) throw new Error('Unexpected member upload validation for ' + file.name);
          }
          console.log('Member work upload validation checks passed.');
          NODE
      - name: Check member profile re-review trigger migration
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const sql = fs.readFileSync('releases/6.6/member-profile-review-trigger.sql', 'utf8');
          const required = [
            'security invoker',
            'set search_path = pg_catalog, public, auth',
            'auth.uid() = old.user_id',
            "-> 'app_metadata' ->> 'role'",
            "new.profile_status := 'pending'",
            'new.updated_at := now()',
            'before update of display_name, account_type, bio, city, specialty, image_url, work_url',
            'revoke all on function'
          ];
          for (const snippet of required) {
            if (!sql.toLowerCase().includes(snippet.toLowerCase())) throw new Error('Missing profile review safeguard: ' + snippet);
          }
          if (/drop\\s+table|delete\\s+from|truncate\\s+table/i.test(sql)) throw new Error('Unexpected destructive SQL in profile trigger migration.');
          console.log('Member profile re-review migration static checks passed.');
          NODE
      - name: Check approved member work publication MIME allowlist
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const html = fs.readFileSync('index.html', 'utf8');
          const required = [
            'const publicMimeByExtension={pdf:"application/pdf",doc:"application/msword",docx:"application/vnd.openxmlformats-officedocument.wordprocessingml.document",txt:"text/plain"}',
            'const publicMime=publicMimeByExtension[extension]',
            'fileData.size>25*1024*1024',
            'contentType:publicMime'
          ];
          for (const snippet of required) {
            if (!html.includes(snippet)) throw new Error('Missing approved work publication safeguard: ' + snippet);
          }
          if (/contentType:fileData\\.type/.test(html)) throw new Error('Untrusted Blob MIME still used for approved member work publication.');
          console.log('Approved member work publication MIME checks passed.');
          NODE
      - name: Check read-only admin RPC audit coverage
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const sql = fs.readFileSync('releases/6.6/preflight-admin-rpc-readonly.sql', 'utf8');
          for (const name of ['admin_review_member_profile','admin_review_member_work','admin_review_community_submission']) {
            if (!sql.includes(name)) throw new Error('Missing admin RPC audit target: ' + name);
          }
          if (!sql.includes('pg_get_functiondef') || !sql.includes('has_function_privilege')) throw new Error('Admin RPC audit must inspect function definitions and EXECUTE grants.');
          const executable = sql.replace(/--.*$/gm, '');
          if (/^\\s*(create|alter|drop|grant|revoke|insert|update|delete|truncate)\\s+/im.test(executable)) throw new Error('Read-only admin RPC preflight contains a mutating SQL statement.');
          console.log('Read-only admin RPC audit checks passed.');
          NODE
      - name: Check secure broadcast and academy media handling
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const html = fs.readFileSync('index.html', 'utf8');
          const required = [
            'function safeHttpsMediaUrl(value)',
            'url.protocol==="https:" && !!url.hostname',
            'const url=safeHttpsMediaUrl(value)',
            'const streamUrl=safeHttpsMediaUrl(station.stream)',
            'const streamUrl=safeHttpsMediaUrl(channel.stream)',
            'const streamUrl=isAbsoluteHttpsUrl(record.content_url||"")',
            'function sanitizePublicContentRecord(item)',
            '.select("id,content_type,title,category,description,image_url,content_url,extra_data,published,created_at")',
            'function academyLessonExtraMarkup(material)',
            '["lesson_text","محتوى المحاضرة"]',
            '["learning_objectives","أهداف التعلم"]',
            '["exercise","التدريب العملي"]',
            '["homework","الواجب"]',
            'function destroyInlineHlsVideos(root=document)',
            'destroyInlineHlsVideos(dialog)'
          ];
          for (const snippet of required) {
            if (!html.includes(snippet)) throw new Error('Missing secure media/academy safeguard: ' + snippet);
          }
          if (/\.from\("site_content"\)\s*\.select\("\*"\)\s*\.eq\("published",true\)/.test(html)) {
            throw new Error('Public site content query must not select every column.');
          }
          const vm = require('node:vm');
          const sanitizer = html.match(/function sanitizePublicContentRecord\(item\)\s*\{[\s\S]*?\n\}/);
          const mapper = html.match(/function mapContentRecord\(item\)\s*\{[\s\S]*?\n\}/);
          if (!sanitizer || !mapper) throw new Error('Public content sanitizer or mapper is missing.');
          const runtime = vm.createContext({});
          vm.runInContext(
            sanitizer[0] + '\n' + mapper[0] +
            '\nthis.sanitize = sanitizePublicContentRecord; this.map = mapContentRecord;',
            runtime
          );
          const publicRecord = runtime.sanitize({
            id: 7, content_type: 'tv', title: 'قناة اختبار', content_url: 'https://stream.example/live.m3u8',
            extra_data: { rights_status: 'official', source_url: 'https://source.example/rights',
              director: 'مخرج اختبار', writer: 'كاتب اختبار', duration: '12 دقيقة', production_year: '2026', year: '2025',
              internal_admin_note: 'must not leak', lesson_text: 'درس', resources: [{title:'مرجع',url:'https://docs.example/a'}] },
            published: true
          });
          if (publicRecord.extra_data.internal_admin_note !== undefined) throw new Error('Private admin-only metadata leaked into public content.');
          for (const field of ['director','writer','duration','production_year','year']) {
            if (publicRecord.extra_data[field] === undefined) throw new Error('Short-film field was dropped by public sanitization: ' + field);
          }
          const mapped = runtime.map(publicRecord);
          if (mapped.stream !== 'https://stream.example/live.m3u8') throw new Error('Admin content_url is not connected to the public TV/radio stream field.');
          if (mapped.rightsStatus !== 'official' || mapped.sourceUrl !== 'https://source.example/rights') throw new Error('Broadcast rights metadata did not survive public sanitization.');
          if (mapped.director !== 'مخرج اختبار' || mapped.writer !== 'كاتب اختبار' || mapped.duration !== '12 دقيقة' || mapped.productionYear !== '2026') throw new Error('Short-film metadata did not survive public sanitization and mapping.');
          if (!mapped.extra || mapped.extra.lesson_text !== 'درس' || mapped.extra.resources.length !== 1) throw new Error('Academy lesson metadata/resources did not survive public sanitization.');
          console.log('Secure media, academy publishing, and public content data-flow checks passed.');
          NODE
      - name: Check academy custom lesson indexing and lesson detail mapping
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const vm = require('node:vm');
          const html = fs.readFileSync('index.html', 'utf8');
          const curriculum = html.match(/const academyLessons = \[([\s\S]*?)\n\];/);
          const resolver = html.match(/function academyLessonTitles\(materials(?:\s*=\s*publicContentRecords\s*\|\|\s*\[\])?\)\s*\{[\s\S]*?\n\}/);
          const mapper = html.match(/function mapContentRecord\(item\)\s*\{[\s\S]*?\n\}/);
          const escape = html.match(/function escapeHTML\(value\)\s*\{[\s\S]*?\n\}/);
          const safeMedia = html.match(/function safeHttpsMediaUrl\(value\)\s*\{[\s\S]*?\n\}/);
          const extraMarkup = html.match(/function academyLessonExtraMarkup\(material\)\s*\{[\s\S]*?\n\}/);
          if (!curriculum || !resolver || !mapper || !escape || !safeMedia || !extraMarkup) throw new Error('Academy lesson index, record mapper, or safe lesson renderer is missing.');
          const context = vm.createContext({ publicContentRecords: [], URL });
          vm.runInContext(
            'const academyLessons = [' + curriculum[1] + '\n];\n' +
            mapper[0] + '\n' + resolver[0] +
            '\nthis.resolveTitles = academyLessonTitles; this.mapRecord = mapContentRecord;',
            context
          );
          const rawRecords = [
            { content_type: 'academy', title: 'ورشة كتابة المشهد', published: true, extra_data: { lesson_order: 2, lesson_text: 'نص الورشة' }, content_url: 'https://cdn.example/lesson.mp4' },
            { content_type: 'academy', title: 'ورشة تطوير الشخصيات', published: true, extra_data: { lesson_order: 1 } },
            { content_type: 'academy', title: 'الفرق بين الرواية والقصة والسيناريو', published: true, extra_data: {} },
            { content_type: 'radio', title: 'لا تظهر في الأكاديمية', published: true },
            { content_type: 'academy', title: 'مسودة مخفية', published: false }
          ];
          context.publicContentRecords = rawRecords;
          const titles = context.resolveTitles();
          if (titles.length !== 32 || titles[30] !== 'ورشة تطوير الشخصيات' || titles[31] !== 'ورشة كتابة المشهد') {
            throw new Error('Raw published lesson records must be normalized and ordered in the academy index.');
          }
          if (titles.filter(title => title === 'الفرق بين الرواية والقصة والسيناريو').length !== 1) throw new Error('A curriculum lesson was duplicated.');
          if (titles.includes('لا تظهر في الأكاديمية') || titles.includes('مسودة مخفية')) throw new Error('Non-academy or unpublished content entered the academy index.');
          const mapped = context.mapRecord(context.publicContentRecords[0]);
          if (mapped.content_url !== 'https://cdn.example/lesson.mp4' || mapped.extra.lesson_text !== 'نص الورشة') {
            throw new Error('Lesson detail mapping dropped the published media URL or structured lesson text.');
          }
          vm.runInContext(escape[0] + '\n' + safeMedia[0] + '\n' + extraMarkup[0] +
            '\nthis.renderExtra = academyLessonExtraMarkup;', context);
          const safeMarkup = context.renderExtra({ extra: {
            lesson_text: '<img src=x onerror=alert(1)>',
            resources: [
              { title: '<script>bad</script>', url: 'https://docs.example/guide' },
              { title: 'رابط غير آمن', url: 'javascript:alert(1)' }
            ]
          }});
          if (safeMarkup.includes('<img src=x') || safeMarkup.includes('<script>') ||
              !safeMarkup.includes('&lt;script&gt;bad&lt;/script&gt;') ||
              safeMarkup.includes('javascript:alert')) {
            throw new Error('Academy lesson text/resources must be escaped and unsafe resource URLs omitted.');
          }
          const openStart = html.indexOf('function openLesson(index)');
          const openEnd = html.indexOf('function closeLesson()', openStart);
          const openBody = html.slice(openStart, openEnd);
          if (openStart < 0 || !openBody.includes('destroyInlineHlsVideos(dialog);') ||
              openBody.indexOf('destroyInlineHlsVideos(dialog);') > openBody.indexOf('body.innerHTML=')) {
            throw new Error('Switching lessons must release any previous inline HLS stream before replacing lesson content.');
          }
          console.log('Published academy lesson indexing, ordering, detail mapping, and player cleanup checks passed.');
          NODE
      - name: Check for server-side secret key patterns
        shell: bash
        run: |
          if grep -nE 'sb_secret_[A-Za-z0-9_-]{20,}|service_role[[:space:]]*[:=][[:space:]]*["\x27][^"\x27]{20,}' index.html; then
            echo "Potential server-side secret found in client code."
            exit 1
          fi
          echo "No known server-side secret-key pattern found in index.html."

      - name: Test short-film metadata and rights-gated playback
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const html = fs.readFileSync('index.html', 'utf8');
          const mapper = html.match(/function mapContentRecord\(item\)\s*\{[\s\S]*?\n\}/);
          const renderer = html.match(/function renderShortFilms\(\)\s*\{[\s\S]*?\n\}/);
          if (!mapper || !renderer) throw new Error('Short-film mapper or renderer is missing.');
          for (const field of ['writer:', 'productionYear:', 'rightsStatus:', 'sourceUrl:']) {
            if (!mapper[0].includes(field)) throw new Error('Short-film metadata mapping is missing ' + field);
          }
          for (const field of ['item.director', 'item.writer', 'item.duration', 'item.productionYear']) {
            if (!renderer[0].includes(field)) throw new Error('Short-film card does not display ' + field);
          }
          if (!renderer[0].includes('const rightsDocumented=') || renderer[0].includes('rightsApproved')) throw new Error('Rights metadata must be described as documented, not treated as an independent legal approval.');
          if (!renderer[0].includes('safeHttpsMediaUrl(item.work)') ||
              !renderer[0].includes('safeHttpsMediaUrl(item.sourceUrl)') ||
              !renderer[0].includes('["owner","official","licensed"]') ||
              !renderer[0].includes('&&!!safeHttpsMediaUrl(item.sourceUrl)')) {
            throw new Error('Short-film playback must require an approved rights status and HTTPS source reference.');
          }
          if (!renderer[0].includes('target="_blank" rel="noopener noreferrer"')) {
            throw new Error('Short-film external links must use safe new-tab attributes.');
          }
          console.log('Short-film metadata and rights-gated playback checks passed.');
          NODE
