name: Platform quality checks

on:
  push:
    branches:
      - "stage/**"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  inline-javascript:
    name: Check inline JavaScript syntax
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Parse every inline JavaScript block
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const os = require('node:os');
          const path = require('node:path');
          const { spawnSync } = require('node:child_process');

          const html = fs.readFileSync('index.html', 'utf8');
          const scriptTag = /<script\b([^>]*)>([\s\S]*?)<\/script\s*>/gi;
          let match;
          let checked = 0;
          let failed = false;

          while ((match = scriptTag.exec(html)) !== null) {
            const attrs = match[1] || '';
            const code = match[2] || '';
            if (/\bsrc\s*=/i.test(attrs) || !code.trim()) continue;
            if (/type\s*=\s*["']application\/(?:ld\+)?json["']/i.test(attrs)) continue;

            checked += 1;
            const file = path.join(os.tmpdir(), `inline-script-${checked}.js`);
            fs.writeFileSync(file, code, 'utf8');
            const result = spawnSync(process.execPath, ['--check', file], { encoding: 'utf8' });

            if (result.status !== 0) {
              failed = true;
              console.error(`Syntax error in inline script #${checked}:`);
              console.error(result.stderr || result.stdout);
            }
          }

          console.log(`Checked ${checked} inline JavaScript block(s).`);
          if (checked === 0) {
            console.error('No inline JavaScript blocks were found; refusing a false-green result.');
            process.exit(1);
          }
          if (failed) process.exit(1);
          NODE

      - name: Check dynamic inline handler arguments
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const vm = require('node:vm');
          const html = fs.readFileSync('index.html', 'utf8');
          const helper = html.match(/function inlineJsArg\(value\)\s*\{[\s\S]*?\n\}/);
          if (!helper) throw new Error('inlineJsArg safety helper is missing.');
          const inlineJsArg = vm.runInNewContext(helper[0] + '; inlineJsArg');
          const payload = '"><img src=x onerror=alert(1)>&' + String.fromCharCode(0x2028);
          const encoded = inlineJsArg(payload);
          const body = encoded.slice(6, -6);
          if (!encoded.startsWith('&quot;') || !encoded.endsWith('&quot;') ||
              /[<>&\u2028\u2029]/.test(body)) {
            throw new Error('inlineJsArg failed the hostile-input serialization test.');
          }
          const lines = html.split(/\r?\n/);
          const unsafe = [];
          lines.forEach((line, index) => {
            const attr = line.match(/onclick="([^"]*)"/);
            if (!attr || !attr[1].includes('\${')) return;
            for (const match of attr[1].matchAll(/\$\{([^}]*)\}/g)) {
              const expr = match[1].trim();
              if (!expr.startsWith('inlineJsArg(') && expr !== 'index' && expr !== '!item.published') {
                unsafe.push('line ' + (index + 1) + ': ' + expr);
              }
            }
          });
          if (unsafe.length) {
            console.error('Dynamic inline handler arguments must use inlineJsArg():');
            console.error(unsafe.join('\n'));
            process.exit(1);
          }
          console.log('Dynamic inline handler arguments passed serialization checks.');
          NODE

      - name: Test URL scheme validation and media URL sinks
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const vm = require('node:vm');
          const html = fs.readFileSync('index.html', 'utf8');
          const helper = html.match(/function safeHttpUrl\(value\)\s*\{[\s\S]*?\n\}/);
          if (!helper) throw new Error('safeHttpUrl validation helper is missing.');
          const safeHttpUrl = vm.runInNewContext(helper[0] + '; safeHttpUrl', {
            URL,
            window: { location: { href: 'https://platform.example/page' } }
          });
          for (const value of ['javascript:alert(1)', 'data:text/html,<script>alert(1)</script>', 'vbscript:msgbox(1)']) {
            if (safeHttpUrl(value) !== '') throw new Error('Unsafe URL scheme was accepted: ' + value);
          }
          for (const value of ['https://cdn.example/media.mp4', 'http://radio.example/live', '/storage/image.png']) {
            if (!safeHttpUrl(value).startsWith('http')) throw new Error('Expected HTTP(S) URL was rejected: ' + value);
          }
          for (const fn of ['playTVChannel', 'playRadioStation']) {
            const start = html.indexOf('function ' + fn + '(');
            if (start < 0 || !html.slice(start, start + 1800).includes('safeHttpUrl(')) {
              throw new Error(fn + ' must validate its stream URL before playback.');
            }
          }
          if (/href="\$\{adminEscape\((?:(?:item\.)?(?:work_url|image_url)|reviewUrl)\)\}"/.test(html)) {
            throw new Error('An escaped but scheme-unvalidated database URL remains in an href.');
          }
          if (/src="\$\{escapeHTML\(item\.cover\)\}"/.test(html)) {
            throw new Error('A database cover URL remains in an image src without scheme validation.');
          }
          const cleanup = html.match(/async function adminRemoveStorageIfUnreferenced\(client,bucket,table,column,path\)\s*\{[\s\S]*?\n\}/);
          if (!cleanup) throw new Error('Shared-storage reference guard is missing.');
          const guard = cleanup[0];
          if (!guard.includes('.from(table).select("id").eq(column,path).limit(1)') ||
              !guard.includes('if(error||!Array.isArray(data))') || !guard.includes('if(data.length)') ||
              !guard.includes('.storage.from(bucket).remove([path])') ||
              !guard.includes('reason:"reference-check-failed"')) {
            throw new Error('Shared-storage guard must verify references and retain files on lookup failure.');
          }
          const deleteStart = html.indexOf('async function adminDeleteScenarioScript(');
          const deleteEnd = html.indexOf('document.getElementById("adminScenarioScriptForm")', deleteStart);
          const deleteBody = html.slice(deleteStart, deleteEnd);
          if (deleteStart < 0 || !deleteBody.includes('adminRemoveStorageIfUnreferenced(')) {
            throw new Error('Scenario deletion must use the shared-storage reference guard.');
          }
          const reviewStart = html.indexOf('async function adminReviewMemberWork(');
          const reviewEnd = html.indexOf('async function adminLoadVisitStats(', reviewStart);
          const reviewBody = html.slice(reviewStart, reviewEnd);
          if (reviewStart < 0 || !reviewBody.includes('adminRemoveStorageIfUnreferenced(')) {
            throw new Error('Member-work review must use the shared-storage reference guard.');
          }
          const saveStart = html.indexOf('document.getElementById("adminScenarioScriptForm")?.addEventListener');
          const saveEnd = html.indexOf('async function loadPublishedScenarioScripts(', saveStart);
          const saveBody = html.slice(saveStart, saveEnd);
          if (saveStart < 0 || !saveBody.includes('adminRemoveStorageIfUnreferenced(')) {
            throw new Error('Replacing a scenario PDF must use the shared-storage reference guard.');
          }
          const siteGuard = html.match(/async function adminRemoveSiteMediaIfUnreferenced\(path\)\s*\{[\s\S]*?\n\}/);
          if (!siteGuard || !siteGuard[0].includes('from("site_content").select("image_url,content_url")') ||
              !siteGuard[0].includes('if(error||!Array.isArray(data))') ||
              !siteGuard[0].includes('storage.from("site-media").remove([path])')) {
            throw new Error('New site-media uploads must be checked against content references before cleanup.');
          }
          const memberFormStart = html.indexOf('document.getElementById("memberWorkForm")?.addEventListener');
          const memberFormEnd = html.indexOf('document.getElementById("accountLogout")', memberFormStart);
          const memberForm = html.slice(memberFormStart, memberFormEnd);
          if (memberFormStart < 0 || !memberForm.includes('adminRemoveStorageIfUnreferenced(accountClient(),')) {
            throw new Error('Member upload failure cleanup must check for a saved member_works reference.');
          }
          const contentSaveStart = html.indexOf('let uploadedAsset=null;');
          const contentSaveEnd = html.indexOf('/* نظّف الملفات القديمة', contentSaveStart);
          const contentSave = html.slice(contentSaveStart, contentSaveEnd);
          if (contentSaveStart < 0 || !contentSave.includes('adminRemoveSiteMediaIfUnreferenced(')) {
            throw new Error('Site-content upload failure cleanup must check content references.');
          }
          const reviewStart2 = html.indexOf('async function adminReviewMemberWork(');
          const reviewEnd2 = html.indexOf('async function adminLoadVisitStats(', reviewStart2);
          const reviewBody2 = html.slice(reviewStart2, reviewEnd2);
          if (reviewBody2.includes('storage.from("site-media").remove([publicPath])')) {
            throw new Error('Do not delete a public copy after an ambiguous review RPC response.');
          }
          console.log('URL scheme tests and critical media URL sinks passed.');
          NODE

      - name: Check HTML escaping and private reader URL validation
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const vm = require('node:vm');
          const html = fs.readFileSync('index.html', 'utf8');
          const esc = html.match(/function escapeHTML\\(value\\)\\s*\\{[\\s\\S]*?\\n\\}/);
          const admin = html.match(/function adminEscape\\(value\\)\\s*\\{[\\s\\S]*?\\n\\}/);
          if (!esc || !admin) throw new Error('HTML escaping helpers are required.');
          const escapeHTML = vm.runInNewContext(esc[0] + '; escapeHTML');
          const adminEscape = vm.runInNewContext(admin[0] + '; adminEscape');
          const hostile = '<img src=x onerror=alert(1)> & "';
          for (const [name, fn] of [['escapeHTML', escapeHTML], ['adminEscape', adminEscape]]) {
            const out = fn(hostile);
            if (/[<>"']/.test(out) || !out.includes('&lt;') || !out.includes('&amp;')) throw new Error(name + ' failed hostile HTML escaping.');
          }
          const start = html.indexOf('async function openScenarioScript(');
          const end = html.indexOf('function closeScenarioReader(', start);
          const reader = html.slice(start, end);
          if (start < 0 || !reader.includes('safeHttpUrl(signed.signedUrl)') || !reader.includes('if(!readerUrl)') || !reader.includes('src="${escapeHTML(readerUrl)}"')) throw new Error('Private scenario iframe must validate its signed URL.');
          console.log('HTML escaping and private reader URL checks passed.');
          NODE
      - name: Check for server-side secret key patterns
        shell: bash
        run: |
          if grep -nE 'sb_secret_[A-Za-z0-9_-]{20,}|service_role[[:space:]]*[:=][[:space:]]*["\x27][^"\x27]{20,}' index.html; then
            echo "Potential server-side secret found in client code."
            exit 1
          fi
          echo "No known server-side secret-key pattern found in index.html."
