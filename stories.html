<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#101010">
<title>القصص والجرائم | سيناريو وسيناريست</title>
<style>
:root{color-scheme:dark;--bg:#101010;--panel:#1b1b1b;--gold:#d5b36a;--muted:#b9b3a8}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#f5f0e7;font-family:Tahoma,Arial,sans-serif;line-height:1.8}
header{padding:24px 16px;text-align:center;background:#171717;border-bottom:1px solid #443a27}
h1{margin:0;color:var(--gold);font-size:24px}header p{margin:6px 0 0;color:var(--muted)}
main{max-width:1100px;margin:24px auto;padding:0 14px}
.tools{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:18px}
input,select{background:var(--panel);color:#fff;border:1px solid #51452e;border-radius:9px;padding:12px;font:inherit}
input{flex:1;min-width:220px}select{min-width:170px}
#status{color:var(--muted);margin:12px 0}
#items{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}
article{background:var(--panel);border:1px solid #39332a;border-radius:12px;overflow:hidden}
.story{display:block;width:100%;height:100%;padding:16px;text-align:right;background:none;border:0;color:inherit;font:inherit;cursor:pointer}
.story h2{margin:0 0 7px;color:var(--gold);font-size:18px}.story p{margin:0;color:var(--muted);font-size:13px}
#reader{display:none;position:fixed;inset:0;background:#000d;padding:14px;overflow:auto;z-index:5}
#reader section{max-width:850px;margin:20px auto;background:var(--panel);border:1px solid #51452e;border-radius:12px;padding:18px}
#reader h2{color:var(--gold);margin-top:0}#readerText{white-space:pre-wrap;overflow-wrap:anywhere}
button.close{background:#332b1d;color:#fff;border:1px solid #75603a;border-radius:8px;padding:8px 14px;font:inherit;cursor:pointer}
a{color:var(--gold)}
</style>
</head>
<body>
<header><h1>سيناريو وسيناريست</h1><p>ملفات الجرائم والحكايات</p></header>
<main>
<div class="tools"><input id="search" placeholder="ابحث عن قضية أو حكاية..."><select id="category"><option value="">كل التصنيفات</option></select></div>
<div id="status">جاري تحميل القصص...</div><div id="items"></div>
<p><a href="./">العودة إلى المنصة الرئيسية</a></p>
</main>
<div id="reader" role="dialog" aria-modal="true"><section><button class="close" onclick="document.getElementById('reader').style.display='none'">إغلاق ✕</button><h2 id="readerTitle"></h2><p id="readerCategory"></p><div id="readerText"></div></section></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
(async()=>{
const status=document.getElementById('status'),items=document.getElementById('items'),search=document.getElementById('search'),category=document.getElementById('category');
const client=window.supabase.createClient('https://asmxyfkmojqzrbnrovmz.supabase.co','sb_publishable_gHjeBgsJd8_8Yc149FLTWg_OiZbNrv1');
let stories=[];
function render(){
 const q=search.value.trim().toLocaleLowerCase('ar'),c=category.value;
 const rows=stories.filter(x=>(!c||x.category===c)&&((x.title||'')+' '+(x.description||'')).toLocaleLowerCase('ar').includes(q));
 items.innerHTML=rows.map(x=>'<article><button class="story" data-id="'+x.id+'"><h2>'+esc(x.title||'حكاية')+'</h2><p>'+esc(x.category||'جرائم وحكايات')+'</p></button></article>').join('');
 items.querySelectorAll('[data-id]').forEach(b=>b.addEventListener('click',()=>{const x=stories.find(y=>String(y.id)===b.dataset.id);if(!x)return;document.getElementById('readerTitle').textContent=x.title||'حكاية';document.getElementById('readerCategory').textContent=x.category||'';document.getElementById('readerText').textContent=x.description||'لا يوجد نص متاح.';document.getElementById('reader').style.display='block';}));
 status.textContent='عدد القصص المنشورة: '+rows.length+' من '+stories.length;
}
function esc(v){return String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
try{
 const {data,error}=await client.from('site_content').select('id,title,category,description,content_type,published,created_at').eq('content_type','stories').eq('published',true).order('created_at',{ascending:false}).limit(200);
 if(error)throw error;
 stories=data||[];
 [...new Set(stories.map(x=>x.category).filter(Boolean))].sort().forEach(c=>{const o=document.createElement('option');o.value=c;o.textContent=c;category.appendChild(o);});
 render();
 if(!stories.length)status.textContent='لا توجد قصص منشورة حاليًا.';
}catch(e){console.error(e);status.textContent='تعذر تحميل القصص. حدّث الصفحة وحاول مرة أخرى.';}
search.addEventListener('input',render);category.addEventListener('change',render);
})();
</script>
</body></html>
